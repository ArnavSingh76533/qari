name: Quran UI APK
on:
  push:
    branches: ["codex/qari-full-page-recitation"]
    paths:
      - ".github/workflows/build-ui-preview-apk.yml"
      - "mobile/lib/main_ui_preview.dart"
      - "mobile/test/ui_preview_test.dart"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quran-ui-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare separate preview app
        run: |
          python3 - <<'PY'
          import pathlib, re, json
          gradle = pathlib.Path("mobile/android/app/build.gradle.kts")
          text = gradle.read_text()
          old = 'applicationId = "com.qari.app"'
          assert text.count(old) == 1
          gradle.write_text(text.replace(old, 'applicationId = "com.qari.app.uipreview"'))
          manifest = pathlib.Path("mobile/android/app/src/main/AndroidManifest.xml")
          manifest.write_text(manifest.read_text().replace('android:label="qari"', 'android:label="Qari UI Preview"'))
          spec = pathlib.Path("mobile/pubspec.yaml").read_text()
          match = re.search(r"^version:\s*([\d.]+)\+(\d+)", spec, re.M)
          release = json.loads(pathlib.Path("releases/app_release.json").read_text())
          code = max(int(match.group(2)), int(release["version_code"])) + 1
          with pathlib.Path("build-preview.env").open("w") as output:
              output.write(f"PREVIEW_VERSION={match.group(1)}\nPREVIEW_CODE={code}\n")
          PY
          cat build-preview.env >> "$GITHUB_ENV"
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Format preview sources
        working-directory: mobile
        run: dart format lib/main_ui_preview.dart test/ui_preview_test.dart
      - name: Verify offline entry and Quran modes
        working-directory: mobile
        run: flutter test test/ui_preview_test.dart test/full_page_recitation_test.dart
      - name: Build ARM64 preview APK
        working-directory: mobile
        run: flutter build apk --release --target lib/main_ui_preview.dart --target-platform android-arm64 --build-name "$PREVIEW_VERSION" --build-number "$PREVIEW_CODE"
      - name: Verify Android package and signature
        run: |
          mkdir -p build-preview
          cp mobile/build/app/outputs/flutter-apk/app-release.apk build-preview/Qari-Quran-UI-Preview.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/aapt" dump badging build-preview/Qari-Quran-UI-Preview.apk | tee build-preview/package.txt
          grep -q "package: name='com.qari.app.uipreview'" build-preview/package.txt
          grep -q "native-code: 'arm64-v8a'" build-preview/package.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build-preview/Qari-Quran-UI-Preview.apk
          sha256sum build-preview/Qari-Quran-UI-Preview.apk | tee build-preview/SHA256SUMS.txt
          stat -c "APK size: %s bytes" build-preview/Qari-Quran-UI-Preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: qari-quran-ui-preview-arm64
          path: build-preview/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
