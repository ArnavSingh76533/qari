# Fast feedback for mobile changes: static analysis + unit/widget tests.
# The full APK build stays in build-apk.yml (manual); this runs on every push
# that touches the Flutter app so compile errors surface in ~3 minutes.
name: Flutter CI

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: mobile
        run: flutter pub get
      - name: Check Dart formatting
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed lib/data/models/recitation_model.dart lib/data/services/recitation_auth.dart lib/data/services/audio_service.dart lib/data/services/streaming_recitation_service.dart lib/features/recitation/presentation/pages/live_recitation_page.dart lib/features/recitation/presentation/widgets/mushaf_reveal_view.dart lib/features/recitation/presentation/widgets/recitation_results.dart lib/features/recitation/presentation/mushaf/mushaf_page_frame.dart lib/features/recitation/presentation/mushaf/floating_recitation_bar.dart lib/features/recitation/presentation/mushaf/mushaf_jump_sheet.dart lib/features/home/presentation/pages/home_page.dart test/full_page_recitation_test.dart test/live_recitation_test.dart test/mushaf_modes_test.dart test/recitation_evidence_test.dart lib/features/recitation/presentation/mushaf/mushaf_theme.dart
      - name: Analyze (errors only)
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        working-directory: mobile
        # Offline reader and lesson harnesses are repaired; exercise every
        # suite, including canonical line spacing and formerly excluded tests.
        run: flutter test --dart-define=CAPTURE_QURAN_UI=true
      - name: Quran UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-ui-previews
          path: mobile/build/review/*.png
