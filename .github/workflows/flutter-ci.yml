# Fast feedback for mobile changes: static analysis + unit/widget tests.
# The full APK build stays in build-apk.yml (manual); this runs on every push
# that touches the Flutter app so compile errors surface in ~3 minutes.
name: Flutter CI

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: mobile
        run: flutter pub get
      - name: Generate model code
        working-directory: mobile
        timeout-minutes: 5
        run: dart run build_runner build --delete-conflicting-outputs --build-filter=lib/data/models/recitation_model.freezed.dart --build-filter=lib/data/models/recitation_model.g.dart
      - name: Format changed Dart files
        working-directory: mobile
        run: |
          dart format lib/data/models/recitation_model.dart lib/data/services/recitation_auth.dart lib/data/services/audio_service.dart lib/data/services/streaming_recitation_service.dart lib/features/recitation/presentation/pages/live_recitation_page.dart lib/features/recitation/presentation/widgets/mushaf_reveal_view.dart lib/features/recitation/presentation/widgets/recitation_results.dart lib/features/recitation/presentation/mushaf/floating_recitation_bar.dart lib/features/recitation/presentation/mushaf/mushaf_jump_sheet.dart lib/features/home/presentation/pages/home_page.dart test/full_page_recitation_test.dart test/mushaf_modes_test.dart test/recitation_evidence_test.dart
      - name: Review sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-review-sources
          path: |
            mobile/lib/data/models/recitation_model.*dart
            mobile/lib/data/services/recitation_auth.dart
            mobile/lib/data/services/audio_service.dart
            mobile/lib/data/services/streaming_recitation_service.dart
            mobile/lib/features/recitation/presentation/pages/live_recitation_page.dart
            mobile/lib/features/recitation/presentation/widgets/mushaf_reveal_view.dart
            mobile/lib/features/recitation/presentation/widgets/recitation_results.dart
            mobile/lib/features/recitation/presentation/mushaf/floating_recitation_bar.dart
            mobile/lib/features/recitation/presentation/mushaf/mushaf_jump_sheet.dart
            mobile/lib/features/home/presentation/pages/home_page.dart
            mobile/test/full_page_recitation_test.dart
            mobile/test/mushaf_modes_test.dart
            mobile/test/recitation_evidence_test.dart
      - name: Analyze (errors only)
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        working-directory: mobile
        # Some legacy tests are network/timer bound; run the stable suites.
        run: |
          flutter test --dart-define=CAPTURE_QURAN_UI=true \
            test/ayah_widget_visibility_test.dart \
            test/recitation_screen_test.dart \
            test/recitation_word_mapping_test.dart \
            test/live_recitation_test.dart \
            test/full_page_recitation_test.dart \
            test/recitation_evidence_test.dart \
            test/mushaf_modes_test.dart \
            test/mushaf_in_place_test.dart \
            test/mushaf_scroll_anchor_test.dart \
            test/mushaf_theme_test.dart \
            test/mushaf_jump_sheet_test.dart \
            test/mushaf_results_test.dart \
            test/word_view_state_test.dart \
            test/audio_frame_contract_test.dart \
            test/corpus_tashkeel_test.dart
      - name: Quran UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-ui-previews
          path: mobile/build/review/*.png
