x-auth-environment: &auth-environment
  # Deliberately required: both APIs must use the same deployment signing key.
  QARI_JWT_SECRET_KEY: ${QARI_JWT_SECRET_KEY:?Set QARI_JWT_SECRET_KEY in infra/.env}
  QARI_JWT_ALGORITHM: ${QARI_JWT_ALGORITHM:-HS256}
  QARI_JWT_ISSUER: ${QARI_JWT_ISSUER:-qari-core-api}
  QARI_ENVIRONMENT: production
  QARI_DEBUG: "false"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qari
      POSTGRES_PASSWORD: ${QARI_POSTGRES_PASSWORD:?Set QARI_POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: qari
    # No host port publish — only the compose network needs it (localhost-only DB).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qari"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port publish — only the compose network needs it.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  core-api:
    build:
      context: ../backend
      dockerfile: core_api/Dockerfile
    restart: unless-stopped
    # Host port 8000 is taken by another service on this VPS — publish
    # core-api on 127.0.0.1:8010 (host nginx proxies /v1/ here).
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      <<: *auth-environment
      QARI_APP_NAME: ${QARI_JWT_ISSUER:-qari-core-api}
      QARI_DATABASE_URL: ${QARI_DATABASE_URL:?Set QARI_DATABASE_URL in infra/.env}
      QARI_REDIS_URL: redis://redis:6379/0
      QARI_CORS_ORIGINS: ${QARI_CORS_ORIGINS:-[]}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../releases:/app/releases:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  recitation-api:
    build:
      context: ../backend/recitation_api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *auth-environment
      QARI_REDIS_URL: redis://redis:6379/1
      QARI_CORE_API_BASE_URL: http://core-api:8000
      QARI_CORS_ORIGINS: ${QARI_CORS_ORIGINS:-[]}
      QARI_RECITATION_API_PUBLIC_URL: ${QARI_RECITATION_API_PUBLIC_URL:?Set the public recitation API URL in infra/.env}
      PYTHONPATH: /app
      QARI_ML_USE_STUB: "false"
      # Trained Qari V50 model (LoRA merged + CT2 INT8, built from local files).
      QARI_FASTERWHISPER_MODEL_DIR: /app/models/qari-v50-ct2
      # Independent (UNPROMPTED) verification model. The V50 adapter is an
      # ORACLE model that reproduces the expected text it is prompted with, so
      # it cannot validate a recitation — this base Quran ASR model, decoded
      # with NO prompt, is the honest witness of what was actually said.
      QARI_FASTERWHISPER_VERIFY_MODEL_DIR: /app/models/qari-ct2-base
      # 2 threads per decode: tier-1 (prompted) and tier-2 (unprompted) run
      # CONCURRENTLY, so 2+2 = all 4 cores (wall time = max, not sum).
      QARI_FASTERWHISPER_THREADS: "2"
      # Which decode feeds the LIVE word reveal: "tier2" = the independent
      # unprompted witness (honest), "corroborated" = the prompt-conditioned
      # Qari model where the witness agrees (more coverage, some over-reveal).
      QARI_EVIDENCE_POLICY: "tier2"
      # Verbose live per-pass diagnostics (tier-1/tier-2 words, matcher cursor).
      # Set to "1" when debugging a live tracking problem.
      QARI_STREAM_DEBUG: "0"
      QARI_REFERENCE_DATA_DIR: /app/reference_data
      # Strict offline: model loads ONLY from local files/volumes.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - qari_audio:/tmp/qari_audio
      - ../ml:/app/ml:ro
      - ../backend/recitation_api/reference_data:/app/reference_data:ro
      - ${QARI_MODELS_DIR:-../models}:/app/models:ro
    ports:
      - "127.0.0.1:8001:8001"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 1

  inference-worker:
    build:
      context: ../backend/recitation_api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *auth-environment
      QARI_REDIS_URL: redis://redis:6379/1
      QARI_ML_USE_STUB: "false"
      QARI_REFERENCE_DATA_DIR: /app/reference_data
      QARI_CORE_API_BASE_URL: http://core-api:8000
      QARI_RECITATION_API_PUBLIC_URL: ${QARI_RECITATION_API_PUBLIC_URL:?Set the public recitation API URL in infra/.env}
      # Trained Qari V50 model (LoRA merged + CT2 INT8, built from local files).
      QARI_FASTERWHISPER_MODEL_DIR: /app/models/qari-v50-ct2
      QARI_BATCH_ANALYSIS_TIMEOUT_SEC: "90"
      PYTHONPATH: /app
      # Strict offline: model loads ONLY from local files/volumes.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - qari_audio:/tmp/qari_audio
      - ../ml:/app/ml:ro
      - ../backend/recitation_api/reference_data:/app/reference_data:ro
      - ${QARI_MODELS_DIR:-../models}:/app/models:ro
    command: python -m app.workers.fast_inference_worker
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3

# TLS terminates at Cloudflare (qari.pneumetron.com) → host nginx (:80)
# → these services. No container nginx / minio needed on this VPS.

volumes:
  pgdata:
  redisdata:
  qari_audio:
