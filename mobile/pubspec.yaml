name: qari
description: Qari - AI-Powered Quran Learning App
publish_to: 'none'
version: 1.0.49+71

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.5.0
  retrofit: ">=4.9.1 <4.9.2"
  pretty_dio_logger: ^1.4.0

  # Models / Serialization
  freezed: ^3.0.0
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  json_serializable: ^6.8.0

  # Audio
  just_audio: ^0.9.38
  audio_session: ^0.1.18

  # Networking (native-crash debug echo)
  http: ^1.2.0

  # Recording
  record: ^7.0.0

  # Storage
  shared_preferences: ^2.3.0
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.2.0

  # UI / Fonts
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0

  # Platform
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  haptic_feedback: ^0.5.1
  share_plus: ^12.0.0

  # Location + compass (Qibla direction)
  geolocator: ^14.0.2
  flutter_compass: ^0.8.1

  # OTA auto-update
  package_info_plus: ^8.3.0
  open_filex: ^4.5.0

  # Internationalization
  intl: ^0.20.0
  bidi: ^2.0.13

  # Utils
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.6.4
  custom_lint: ^0.7.6
  riverpod_lint: ^2.3.10
  retrofit_generator: ^9.0.0
  drift_dev: ">=2.23.0 <2.28.2"

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/icons/
    - assets/quran_corpus.json.gz
    - assets/mushaf_line_ends.json
    - assets/vocab_curriculum.json

  fonts:
    - family: KFGQPCUthmanicHafs
      fonts:
        - asset: assets/fonts/KFGQPCUthmanicHafs-Regular.otf
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
